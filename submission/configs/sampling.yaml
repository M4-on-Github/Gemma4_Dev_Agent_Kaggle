# generate_content_config for every agent (plan.md §4.3 starting values).
# Allowed fields per HARNESS_README mirror: temperature, top_p, top_k, max_output_tokens, presence_penalty,
# frequency_penalty, stop_sequences, response_mime_type, seed, thinking_config.
temperature: 0.2          # scorer default is 1.0; E4 A/Bs 0.2 vs 1.0
top_p: 0.95
top_k: 64
max_output_tokens: 4096   # keeps prompt + output well under the 32,768 context wall; E11 tries 2048/6144
thinking_config:
  include_thoughts: true  # false = thinking off (sent as enable_thinking=false); E2/E3 ablate this
  thinking_budget: 256    # VERIFY(Q3): community source reading says the harness does NOT forward this
                          # budget to vLLM (only enable_thinking on/off), so max_output_tokens is the real cap.
                          # Keep it anyway: harmless if ignored, binding if a harness update enforces it.
