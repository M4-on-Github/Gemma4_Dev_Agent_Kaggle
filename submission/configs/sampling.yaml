# generate_content_config for every agent (plan.md §4.3 starting values).
# Allowed fields per HARNESS_README mirror: temperature, top_p, top_k, max_output_tokens, presence_penalty,
# frequency_penalty, stop_sequences, response_mime_type, seed, thinking_config.
#
# EXP-003 (public-budget-shape test, 2026-10-19): max_output_tokens and thinking_budget match
# verracodeguacas/gemma-4-agent-budget-fit-single-agent (confirmed directly from its notebook source).
# top_k dropped: the public config doesn't set it; left out here too rather than guessing a value for it.
temperature: 0.2          # scorer default is 1.0; E4 A/Bs 0.2 vs 1.0
top_p: 0.95
max_output_tokens: 8192   # was 4096 (E0); vLLM refuses prompt+output above 32,768 tokens total
thinking_config:
  include_thoughts: true  # false = thinking off (sent as enable_thinking=false); E2/E3 ablate this
  thinking_budget: 4096   # was 256 (E0); VERIFY(Q3): community source reading says the harness does NOT
                          # forward this budget to vLLM (only enable_thinking on/off), so max_output_tokens
                          # is the real cap. Keep it anyway: harmless if ignored, binding if a harness
                          # update enforces it.
