# Per-task budgets (plan.md §4.4). The scorer reads exactly these four keys under `evaluation:`;
# a missing key means NO limit, and the harness default (60 min/task) would blow the 12 h run budget.
# VERIFY(Q2): confirm key names and the `evaluation:` nesting against data/raw/sample_submission/eval_config.yaml.
# Worst case per plan: 120 tasks x (4.0 + 1.0 min setup) = 10.0 h <= 11.0 h gate (tools/validate_submission.py).
#
# EXP-005 (safe resubmit, 2026-10-20): E0 with ONLY max_time_minutes trimmed 4.5 -> 4.0, after submission #2
# (EXP-003 bundle, 18.0 h worst case) hit "Notebook Timeout". E0 at 4.5 sat exactly on the 11.0 h gate; 4.0 gives
# 1.0 h of formula margin and is strictly time-dominated by E0, which already completed on this hidden set.
# Expected cost from E0's dev-48 traces (cumulative elapsed_s of each resolved task's last edit_file): 10/11
# resolves made their final edit by 227 s; only fastapi_14301 (edits at 245-262 s) would be cut by a 240 s cap,
# i.e. ~9% of resolves, ~0.4 of E0's 4/58 public tasks -- below the reported +/-2-task LB noise, so this run is
# read mainly as a near-replicate of E0 (LB variance probe). Sampling and prompt are E0's, unchanged.
#
# EXP-003 (public-budget-shape test, 2026-10-19): this is E0's config, restored after EXP-003's dev-48 test
# run (notebooks/exp010_public_budget_dev48/, kernel rainm4/gemma4-exp003-public-budget-dev48, results in
# experiments/EXP-003-public-budget.md). EXP-003 found the public bundle's max_time_minutes: 8/max_tool_calls:
# 28 combination resolved slightly worse (18.75% vs E0's 22.9%, n=48, CIs overlap) and that the tightened
# 28-call cap directly cost at least one resolve (rich_3676, stopped at exactly 28 calls) that E0's 45-call
# budget allowed to finish -- do not readopt max_tool_calls: 28 without first isolating it from the other
# bundled changes (see that doc's decision section).
#
# EXP-018 provenance audit (2026-10-22, zero GPU; experiments/EXP-018-config-provenance-audit.md). Comments only:
# NO value in this file was changed for submission #5.
#  - max_time_minutes 4.0 is a post-timeout safety flinch (EXP-005, after submission #2 timed out), not a
#    measurement. EXP-016 section 3 then reversed the premise it protected: projected ACTUAL time is 4.0 ~= 7.9 h,
#    4.5 = 8.61 h (measured; E0 survived), 5.0 = 9.40 h, 6.0 = 10.99 h, 7.0 = 12.57 h (past the 12 h hard limit),
#    against a calibrated operational ceiling of ~10.5 h. So 4.0 sits ~2.5 h below our own ceiling and pays
#    resolves for margin we do not need (self-priced above at ~0.4 of E0's public tasks).
#  - DELIBERATELY LEFT AT 4.0 for submission #5: raising it adds timeout risk, and a timeout scores zero (see
#    submission #2). Raising it toward 4.5-5.0 is queued for the EXP-014 / EXP-018 follow-up, once dev-48
#    quota exists. Do not change it without that run.
#  - max_tool_calls 45 is non-binding on E0's dev-48 (median 32 calls, 1 of 48 tasks at the cap), so it costs
#    nothing to keep; lowering it to 28 DOES cost resolves (EXP-003: the 28-call-capped cohort resolved 0 of 20).
evaluation:
  max_time_minutes: 4.5   # EXP-020 2026-10-23: 4.0 -> 4.5, RESTORING E0's own measured cap (which ran
                          # 8.61 h end-to-end and survived). Required because the thinking swing adds
                          # +4.53 s/turn; holding 4.0 would starve it. 4.5 is also the MAXIMUM the packer
                          # gate allows: worst case = 120 x (cap + 1.0 setup) min, so 4.5 -> exactly
                          # 11.00 h (passes, the gate test is strictly greater-than) and 5.0 -> 12.00 h
                          # (hard error). EXP-018 priced the 4.0 flinch at ~0.4 LB tasks.
  max_tool_calls: 64      # EXP-021 2026-10-24: 45 -> 64. Calls do not bind (E0 median 32, 1/48 at cap) while TIME does (79.2% time-capped), so this is time-neutral by construction: the cap formula is cap-only. Frees the call-capped tail.
  # (prior comment) 45 # get_status and submit_patch are free and do not count
  max_turns: 96           # EXP-021: 70 -> 96, kept above max_tool_calls so turns never bind before calls
  timeout_seconds: 300    # VERIFY(Q2): per community source reading this ALSO caps the Phase-2 grading pytest
                          # run, so we keep the harness default instead of plan's 150 s. The agent-side
                          # command timeout is min(timeout_seconds, remaining task time), so 300 costs nothing;
                          # the prompt wraps pytest in `timeout 90` to bound it anyway.
