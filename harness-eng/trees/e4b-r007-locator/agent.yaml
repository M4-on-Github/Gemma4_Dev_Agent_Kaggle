# Reason: the first edit is made without the reference lines on screen in 28, 25, 26 of 56 tasks per base draw.
agent_class: SequentialAgent
sub_agents:
  - config_path: sub_agents/locator.yaml
  - config_path: sub_agents/editor.yaml
